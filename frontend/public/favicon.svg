<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#0066CC"/>
  
  <!-- Briefcase (main symbol) -->
  <g transform="translate(128, 128)">
    <!-- Briefcase body -->
    <rect x="-45" y="-25" width="90" height="60" rx="8" fill="white" stroke="none"/>
    
    <!-- Briefcase handle -->
    <path d="M -35,-25 Q -35,-45 0,-45 Q 35,-45 35,-25" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Briefcase lock circle -->
    <circle cx="0" cy="0" r="8" fill="#0066CC"/>
    
    <!-- Divider line (subtle) -->
    <line x1="-45" y1="5" x2="45" y2="5" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Checkmark (verification) -->
    <g transform="translate(25, -5)">
      <polyline points="-8,5 0,12 15,-5" fill="none" stroke="#00B050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Corner accent (job search symbol) -->
  <g transform="translate(200, 56)">
    <circle cx="0" cy="0" r="18" fill="#00B050"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="3"/>
    <line x1="8" y1="8" x2="14" y2="14" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
